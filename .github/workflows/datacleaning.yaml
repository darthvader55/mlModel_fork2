name: Data Cleaning Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - dev-main
      - prod
    paths:
      - 'ModelFiles/datacleaning.py'
      - 'ModelFiles/originaldata.csv'
      - 'ModelFiles/training_eval.py'
      - 'ModelFiles/flaskApp.py'
      - 'ModelFiles/Dockerfile'
      - 'ModelFiles/requirements.txt'

jobs:
  unit-test-on-datacleaning:  ### job1: unit test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List project structure
        run: ls -R

      - name: Install dependencies
        run: |
          cd ModelFiles
          pip install -r requirements.txt

      - name: Run pytest on datacleaning unit tests
        run: |
          cd ModelFiles
          pytest test_datacleaning.py --maxfail=1 --disable-warnings -v



  datacleaning: ### job2. datacleaning
    name: datacleaning_pipeline
    runs-on: ubuntu-latest
    needs: unit-test-on-datacleaning

    steps:
    - name: setup python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: checkout code
      uses: actions/checkout@v4

    - name: install dependencies
      run: |
        pwd
        cd ModelFiles
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: clean_data
      run: |
        pwd
        ls -al
        pwd
        cd ModelFiles
        python datacleaning.py


    - name: Commit cleaned data back to repo
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ModelFiles/cleaned_data.csv
        git commit -m "Add/update cleaned_data.csv from datacleaningworkflow" || echo "Nothing to commit"
        git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} HEAD:${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

