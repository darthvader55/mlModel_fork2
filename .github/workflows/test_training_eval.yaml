name: Unit Test for Model Training

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Data Cleaning Workflow"]
    types:
      - completed
    branches:
      - dev-main
      

jobs:
  test_modeltraining:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }} # on manual triggerr or only if previous workflow was successful
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ModelFiles/requirements.txt

      - name: Run pytest for model training tests
        run: |
          pytest ModelFiles/test_training_eval.py
