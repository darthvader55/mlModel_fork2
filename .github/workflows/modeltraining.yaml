name: modeltrainingworkflow
on: workflow_dispatch

jobs:
        data_pipeline:
                name: modeltraining_pipeline
                runs-on: ubuntu-latest
       
                steps:
                - name: setup python
                  uses: actions/setup-python@v4
                  with:
                    python-version: "3.10"

                - name: checkout code
                  uses: actions/checkout@v4

                - name: Download cleaned data artifact
                  uses: actions/download-artifact@v3
                  with:
                    name: cleaned-data
                    path: ModelFiles/

                - name: install dependencies
                  run: |
                    pwd
                    cd ModelFiles
                    pip install -r requirements.txt

                - name: train_model
                  run: |
                    pwd
                    ls -al
                    pwd
                    cd ModelFiles
                    python training.py
